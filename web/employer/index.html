<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logg inn — Jobbo for arbeidsgivere</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ikoner/apple-touch-icon.png">
<meta name="theme-color" content="#16233A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  .innlogg { padding-block: var(--s-8); display: grid; gap: var(--s-5); }
  .hint { font-size: var(--t-sm); color: var(--ink-2); }
  .hint code { font-family: var(--font-ui); font-weight: 500; color: var(--ink); }
</style>
</head>
<body>
<header class="topp">
  <div class="innhold">
    <a class="merke" href="/">Jobbo<span class="merke-punkt" aria-hidden="true"></span></a>
    <nav><a href="/kandidat/index.html">For jobbsøkere</a></nav>
  </div>
</header>

<main class="smal innlogg">
  <div class="seksjon-hode">
    <h1>Logg inn</h1>
    <p class="tekst">For arbeidsgivere som skal legge ut en stilling eller se søkerne sine.</p>
  </div>

  <form class="kort stabel" id="skjema">
    <label>E-post
      <input type="email" id="epost" autocomplete="username" required>
    </label>
    <label>Passord
      <input type="password" id="passord" autocomplete="current-password" required>
    </label>
    <p class="melding melding-feil" id="feil" role="alert"></p>
    <button class="knapp knapp-full" type="submit" id="send">Logg inn</button>
    <p class="hint">Ny her? <a href="./registrer.html">Opprett konto</a> · <a href="/konto/glemt.html">Glemt passord?</a></p>
  </form>
</main>

<script type="module" src="./login.js"></script>
<script type="module" src="/shared/components/bunn.js"></script>
<script type="module" src="/shared/pwa.js"></script>
</body>
</html>
