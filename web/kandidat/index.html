<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logg inn — Jobbo</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  main { padding-block: var(--s-6) var(--s-8); display: grid; gap: var(--s-5); }
  .hint { font-size: var(--t-sm); color: var(--ink-2); }
  .hint code { font-family: var(--font-ui); font-weight: 500; color: var(--ink); }
</style>
</head>
<body>
<header class="topp">
  <div class="innhold">
    <a class="merke" href="/">Jobbo<span class="merke-punkt" aria-hidden="true"></span></a>
    <nav><a href="/employer/index.html">For arbeidsgivere</a></nav>
  </div>
</header>

<main class="smal">
  <div class="seksjon-hode">
    <h1>Logg inn</h1>
    <p class="tekst">Fyll ut profilen din én gang. Vi finner jobbene du faktisk passer til.</p>
  </div>

  <form class="kort stabel" id="skjema">
    <label>E-post
      <input type="email" id="epost" autocomplete="username" required value="kandidat@jobbo.demo">
    </label>
    <label>Passord
      <input type="password" id="passord" autocomplete="current-password" required value="jobbo-demo">
    </label>
    <p class="melding melding-feil" id="feil" role="alert"></p>
    <button class="knapp knapp-full" type="submit" id="send">Logg inn</button>
    <p class="hint">Demo: <code>kandidat@jobbo.demo</code>, passord <code>jobbo-demo</code></p>
  </form>
</main>

<script type="module" src="./login.js"></script>
</body>
</html>
