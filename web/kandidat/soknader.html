<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Søknadene dine — Jobbo</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  main { padding-block: var(--s-5) var(--s-8); display: grid; gap: var(--s-5); }
  .kvote { display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
           padding: var(--s-3) var(--s-4); border: var(--kant); border-radius: var(--radius);
           background: var(--surface); }
  .soknad { display: grid; gap: var(--s-3); }
  .lopet { display: flex; gap: var(--s-1); align-items: center; font-size: var(--t-xs); flex-wrap: wrap; }
  .lopet-steg { color: var(--ink-3); }
  .lopet-steg[data-na='ja'] { color: var(--ink); font-weight: 600; }
  .lopet-steg[data-passert='ja'] { color: var(--ja); }
  .lopet-pil { color: var(--line-2); }
</style>
</head>
<body>
<header class="topp"><div class="innhold"></div></header>

<main class="smal">
  <div class="seksjon-hode">
    <h1>Søknadene dine</h1>
    <p class="tekst">Du kan ha fem aktive om gangen. Når en avsluttes, frigjøres plassen.</p>
  </div>

  <div class="kvote" id="kvote"></div>
  <div class="stabel" id="liste"></div>
</main>

<script type="module" src="./soknader.js"></script>
</body>
</html>
