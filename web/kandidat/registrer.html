<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opprett konto — Jobbo</title>
<link rel="icon" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/ikoner/apple-touch-icon.png">
<meta name="theme-color" content="#16233A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/base.css">
<link rel="stylesheet" href="/shared/components.css">
<style>
  main { padding-block: var(--s-6) var(--s-8); display: grid; gap: var(--s-5); }
  .hint { font-size: var(--t-sm); color: var(--ink-2); }
  .hint a { color: var(--ink); }

</style>
</head>
<body>
<header class="topp">
  <div class="innhold">
    <a class="merke" href="/">Jobbo<span class="merke-punkt" aria-hidden="true"></span></a>
    <nav><a href="/employer/index.html">For arbeidsgivere</a></nav>
  </div>
</header>

<main class="smal">
  <div class="seksjon-hode">
    <h1>Opprett konto</h1>
    <p class="tekst">Én profil, maks fem matcher om gangen, og et intervju du faktisk kan regne med.</p>
  </div>

  <form class="kort stabel" id="skjema">
    <div class="to-kolonner">
      <label>Fornavn <input id="fornavn" autocomplete="given-name" required></label>
      <label>Etternavn <input id="etternavn" autocomplete="family-name" required></label>
    </div>
    <label>E-post <input type="email" id="epost" autocomplete="email" required></label>
    <label>Passord
      <input type="password" id="passord" autocomplete="new-password" minlength="8" required>
      <span class="svak">Minst 8 tegn.</span>
    </label>
    <label class="rad" style="font-weight: 400">
      <input type="checkbox" id="samtykke" required style="width: auto">
      <span>Jeg har lest <a href="/konto/personvern.html" target="_blank">personvernerklæringen</a> og godtar at Jobbo bruker profilen min til å matche meg mot stillinger.</span>
    </label>
    <p class="melding melding-feil" id="feil" role="alert"></p>
    <p class="melding melding-ok" id="ok" role="status"></p>
    <button class="knapp knapp-full" type="submit" id="send">Opprett konto</button>
    <p class="hint">Har du konto? <a href="./index.html">Logg inn</a></p>
  </form>
</main>

<script type="module" src="./registrer.js"></script>
<script type="module" src="/shared/components/bunn.js"></script>
<script type="module" src="/shared/pwa.js"></script>
</body>
</html>
